name: Website CI

# Qualitätskontrolle ohne Deployment: Die Veröffentlichung bleibt bewusst manuell.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Website prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository laden
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Node.js bereitstellen
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Version, Datum, HTML, Links, PDFs und Geheimnisse prüfen
        shell: pwsh
        run: ./scripts/ci-check.ps1

      - name: JavaScript-Syntax prüfen
        run: |
          node --check assets/js/app.js
          node --check assets/js/admin.js
          node --check assets/js/pdf-viewer.js
          node --check assets/js/story-viewer.js
          node --check assets/js/supabase-config.js

      - name: Git-Historie auf typische Geheimnisse prüfen
        shell: pwsh
        run: |
          $patterns = 'sb_secret_|SUPABASE_SERVICE_ROLE\s*=|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}'
          $hits = git log -G $patterns --all --oneline -- . ':(exclude)scripts/ci-check.ps1' ':(exclude).github/workflows/ci.yml'
          if ($hits) { throw "Mögliches Geheimnis in der Git-Historie:`n$hits" }

      - name: Git-Whitespace prüfen
        run: git diff --check HEAD~1 HEAD 2>/dev/null || git diff --check
