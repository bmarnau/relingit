<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PDF-Ansicht der Geschichte Die Fahrt zum Kunden.">
  <title>PDF ansehen | Die Fahrt zum Kunden</title>
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/pdf-viewer.js" defer></script>
</head>
<body class="viewer-page" data-pdf-file="geschichte.pdf">
  <header class="viewer-header">
    <div class="viewer-brand">
      <a href="index.html" aria-label="Zurück zur Landingpage"><img src="assets/img/reling-it-logo.svg" alt="Reling IT"></a>
      <a class="button secondary" href="index.html">← Zurück</a>
    </div>
    <a class="text-link" id="viewer-download" href="story/current/geschichte.pdf" download>PDF herunterladen</a>
  </header>
  <main class="viewer-main">
    <iframe
      id="pdf-frame"
      src="story/current/geschichte.pdf"
      title="Die Fahrt zum Kunden als PDF"
    ></iframe>
    <p class="viewer-fallback">
      Falls Ihr Browser die PDF nicht anzeigt, können Sie
      <a id="viewer-fallback-link" href="story/current/geschichte.pdf">die PDF direkt öffnen</a>.
    </p>
  </main>
</body>
</html>
